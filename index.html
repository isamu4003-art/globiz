<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globiz - 挑戦と繋がるコミュニティ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <!-- ヘッダー -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
                Globiz
            </h1>
            <button onclick="alert('Globizへようこそ！世界中の挑戦を応援しましょう。')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-semibold transition">
                挑戦を投稿する
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-6xl mx-auto px-4 py-12 text-center">
        <h2 class="text-4xl md:text-5xl font-extrabold mb-4">世界中の挑戦者と繋がろう</h2>
        <p class="text-slate-400 text-lg mb-8">起業、留学、個人プロジェクト。あなたの熱量を世界に届けるプラットフォーム</p>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-left">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <span class="bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full text-xs font-bold">起業</span>
                <h3 class="text-xl font-bold mt-3 mb-2">AIを使った次世代コミュニティ</h3>
                <p class="text-slate-400 text-sm">世界中の起業家が繋がる仕組みを開発中！初期メンバー募集中です。</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <span class="bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full text-xs font-bold">留学</span>
                <h3 class="text-xl font-bold mt-3 mb-2">ドイツでのリアル体験記</h3>
                <p class="text-slate-400 text-sm">現地での生活や仕事、言語習得のリアルな記録を発信していきます。</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <span class="bg-purple-500/20 text-purple-400 px-3 py-1 rounded-full text-xs font-bold">プロジェクト</span>
                <h3 class="text-xl font-bold mt-3 mb-2">Swiftによる新アプリ開発</h3>
                <p class="text-slate-400 text-sm">iOS向けの新しいコミュニティアプリを開発中。フィードバック歓迎！</p>
            </div>
        </div>
    </main>
</body>
</html>
